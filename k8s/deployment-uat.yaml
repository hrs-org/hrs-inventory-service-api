apiVersion: apps/v1
kind: Deployment
metadata:
    name: hrs-inventory-service
    namespace: uat
    labels:
        app: hrs-inventory-service
spec:
    replicas: 1
    selector:
        matchLabels:
            app: hrs-inventory-service
    template:
        metadata:
            labels:
                app: hrs-inventory-service
        spec:
            serviceAccountName: hrs-inventory-service-sa
            automountServiceAccountToken: false
            # SNYK-CC-K8S-6: Add security context at pod level
            securityContext:
                runAsNonRoot: true
                runAsUser: 10003 # High UID to avoid host conflicts
                fsGroup: 10003
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: hrs-inventory-service
                  image: __ACR_NAME__.azurecr.io/hrs-inventory-service:__IMAGE_TAG__
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 8080
                        name: http
                  env:
                      - name: ASPNETCORE_ENVIRONMENT
                        value: "Production"
                      - name: ASPNETCORE_URLS
                        value: "http://+:8080"
                      # MongoDB Configuration
                      - name: ConnectionStrings__MongoDb
                        value: "__MONGODB_CONNECTION_STRING__"
                      # Auth0 Configuration
                      - name: Auth0__Domain
                        value: "__AUTH0_DOMAIN__"
                      - name: Auth0__Audience
                        value: "__AUTH0_AUDIENCE__"
                      # CORS Configuration
                      - name: AllowedOrigins
                        value: "__ALLOWED_ORIGINS__"
                  # SNYK-CC-K8S-9, 10, 11, 8, 42: Add container security context
                  securityContext:
                      allowPrivilegeEscalation: false # SNYK-CC-K8S-8
                      privileged: false # SNYK-CC-K8S-9
                      runAsNonRoot: true # SNYK-CC-K8S-10
                      runAsUser: 10003 # SNYK-CC-K8S-10 (high UID)
                      readOnlyRootFilesystem: true # SNYK-CC-K8S-6
                      capabilities:
                          drop:
                              - ALL # SNYK-CC-K8S-11, 42
                  volumeMounts:
                      - name: tmp
                        mountPath: /tmp
                      - name: aspnet-tmp
                        mountPath: /app/.aspnet
                  resources:
                      requests:
                          memory: "128Mi"
                          cpu: "100m"
                          ephemeral-storage: "512Mi"
                      limits:
                          memory: "256Mi"
                          cpu: "250m"
                          ephemeral-storage: "1Gi"
                  livenessProbe:
                      httpGet:
                          path: /health
                          port: 8080
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 3
                  readinessProbe:
                      httpGet:
                          path: /health
                          port: 8080
                      initialDelaySeconds: 15
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 2
            volumes:
                - name: tmp
                  emptyDir:
                      sizeLimit: "256Mi"
                - name: aspnet-tmp
                  emptyDir:
                      sizeLimit: "256Mi"
            imagePullSecrets:
                - name: acr-secret
---
apiVersion: v1
kind: Service
metadata:
    name: hrs-inventory-service
    namespace: uat
    labels:
        app: hrs-inventory-service
spec:
    type: ClusterIP
    ports:
        - port: 80
          targetPort: 8080
          protocol: TCP
          name: http
    selector:
        app: hrs-inventory-service
